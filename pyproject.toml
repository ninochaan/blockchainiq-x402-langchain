[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchainiq-x402-langchain"
version = "0.1.0"
description = "LangChain tool for Blockchain IQ's pay-per-call crypto data API (x402 v2, USDC on Base)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain-core>=0.3",
    "pydantic>=2",
    "requests>=2.31",
    "eth-account>=0.11",
]

[tool.setuptools]
py-modules = ["blockchainiq_x402", "blockchainiq_tool"]
